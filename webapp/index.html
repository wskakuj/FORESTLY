<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Forestly</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="brand">
      <span class="logo">🌲</span>
      <div>
        <div id="app-name">Forestly</div>
        <div id="app-version"></div>
      </div>
    </div>
    <div id="topbar-right">
      <button class="btn ghost" id="btn-theme" title="Przełącz jasny / ciemny motyw"><svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Motyw</span></button>
      <button class="btn ghost" id="btn-check-update" title="Sprawdź dostępność nowej wersji"><svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg><span>Aktualizacje</span></button>
      <button class="btn danger ghost hidden" id="btn-stop"><svg class="bi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg><span>Zatrzymaj</span></button>
    </div>
  </header>

  <div id="main">
    <nav id="sidebar"></nav>
    <div id="content">
      <div id="content-scroll"></div>
    </div>
  </div>

  <footer id="bottombar">
    <div id="status">
      <span id="status-dot"></span>
      <span id="status-text">System aktywny. Skonfiguruj proces i rozpocznij działanie.</span>
      <span id="task-timer" class="hidden"></span>
    </div>
    <div id="progress-wrap">
      <div id="progress-file"></div>
      <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>
  </footer>
</div>

<div id="log-panel">
  <div id="log-head">
    <span class="log-title">Dziennik zdarzeń</span>
    <div>
      <button class="btn ghost small" id="btn-clear-log">Wyczyść</button>
      <button class="btn ghost small" id="btn-log-toggle">▲</button>
    </div>
  </div>
  <div id="log"></div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="app.js"></script>
</body>
</html>

name: Build Forestly

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pyautogui pywin32 python-docx PyMuPDF pypdf Pillow pandas numpy openpyxl pyodbc CTkToolTip xlrd pywebview pythonnet pyinstaller

    - name: Verify packages installed
      shell: cmd
      run: pip list

    - name: Build Forestly.exe (nowe GUI web)
      shell: cmd
      run: pyinstaller --noconfirm --onefile --windowed --icon "forestly.ico" --name "Forestly" --add-data "STR_TYT.docx;." --add-data "STR_TYT_TYLKO-ISL-2.docx;." --add-data "Skroty.docx;." --add-data "opis_og_szablon.docx;." --add-data "gdos_obszary.json;." --add-data "BIAŁYNIN KRASÓWKA.xlsx;." --add-data "config;config" --add-data "pusty;pusty" --add-data "webapp;webapp" --collect-all customtkinter --collect-all CTkToolTip --collect-all pandas --collect-all numpy --collect-all fitz --collect-all openpyxl --collect-all docx --collect-all PIL --collect-all pypdf --collect-all pyodbc --collect-all webview --collect-all clr_loader --hidden-import win32com.client --hidden-import pythoncom --hidden-import pyautogui --collect-submodules app main_web.py

    - name: Build Forestly_OLD.exe (klasyczne GUI CustomTkinter)
      shell: cmd
      run: pyinstaller --noconfirm --onefile --windowed --icon "forestly.ico" --name "Forestly_OLD" --add-data "STR_TYT.docx;." --add-data "STR_TYT_TYLKO-ISL-2.docx;." --add-data "Skroty.docx;." --add-data "BIAŁYNIN KRASÓWKA.xlsx;." --add-data "config;config" --add-data "pusty;pusty" --collect-all customtkinter --collect-all CTkToolTip --collect-all pandas --collect-all numpy --collect-all fitz --collect-all openpyxl --collect-all docx --collect-all PIL --collect-all pypdf --collect-all pyodbc --hidden-import win32com.client --hidden-import pythoncom --hidden-import pyautogui --collect-submodules app main.py

    - name: Upload EXE to release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/Forestly.exe
          dist/Forestly_OLD.exe
        body_path: RELEASE_NOTES.md
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
